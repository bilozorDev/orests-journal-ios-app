[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto

addopts =
    -v
    --strict-markers
    --tb=short
    --cov=app
    --cov-report=term-missing:skip-covered
    --cov-report=html
    --cov-report=xml

markers =
    unit: Unit tests for services and utilities
    integration: Integration tests for API endpoints
    contract: Contract tests for iOS compatibility
    schema: Schema validation tests
    slow: Slow-running tests that may be skipped in quick runs

    # Feature markers
    medication: Tests related to medication features
    notification: Tests related to notification features
    health: Tests related to health events
    pet: Tests related to pet management
    family: Tests related to family features
    auth: Tests related to authentication

# Coverage settings
[coverage:run]
source = app
omit =
    */tests/*
    */venv/*
    */migrations/*
    */__pycache__/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

exclude_lines =
    # Standard pragma
    pragma: no cover

    # Don't complain about missing debug code
    def __repr__
    if self\.debug

    # Don't complain if tests don't hit defensive assertion code
    raise AssertionError
    raise NotImplementedError

    # Don't complain if non-runnable code isn't run
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod

[coverage:html]
directory = htmlcov

# Ignore warnings from third-party libraries
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:jose
    ignore::UserWarning:passlib
